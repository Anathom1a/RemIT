# Полный стек RemIT: сервер идентификации и ретрансляции (hbbs + hbbr),
# сайт с кабинетом, админкой и API клиента, база данных.
#
#   docker compose --env-file .env up -d
#
# Наружу смотрит только nginx (см. server/nginx/remit.conf).

services:
  db:
    image: postgres:16-alpine
    container_name: remit-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remit}
      POSTGRES_USER: ${POSTGRES_USER:-remit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-remit}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # hbbs + hbbr. Вход, адресные книги и учёт времени обслуживает сайт (web).
  # Рекомендуемый образ — свой, из .github/workflows/build-server-image.yml:
  # в нём hbbs проверяет суточный лимит и токены входа (MUST_LOGIN).
  # Стоковый rustdesk/rustdesk-server-s6 тоже работает, но без этих проверок.
  rustdesk:
    image: ${RUSTDESK_IMAGE:-rustdesk/rustdesk-server-s6:latest}
    container_name: remit-rustdesk
    ports:
      - '21115:21115'
      - '21116:21116'
      - '21116:21116/udp'
      - '21117:21117'
    # WebSocket для веб-клиента: наружу их отдаёт nginx с TLS.
    expose:
      - '21118'
      - '21119'
    environment:
      # Ретранслятор по умолчанию. Дополнительные узлы сайт передаёт hbbs сам
      # (админка → «Ретрансляторы») и возвращает список после перезапуска.
      - RELAY=${PUBLIC_ADDR}:21117
      - ENCRYPTED_ONLY=1
      # Y — соединяться могут только клиенты, вошедшие в аккаунт.
      - MUST_LOGIN=${MUST_LOGIN:-N}
      - TZ=Europe/Moscow
      # Ключ, которым сайт подписывает токены входа: по нему hbbs их проверяет.
      - RUSTDESK_API_JWT_KEY=${JWT_KEY:?задайте JWT_KEY}
      # Адрес службы квот: hbbs спрашивает её перед выдачей punch hole.
      - REMIT_QUOTA_URL=http://web:3000/api/v1/quota/check
      - REMIT_SERVICE_TOKEN=${REMIT_SERVICE_TOKEN:?задайте REMIT_SERVICE_TOKEN}
    volumes:
      # Здесь лежит ключ сервера id_ed25519 — его нельзя терять и менять.
      - ./data/rustdesk:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: remit-web
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    volumes:
      # Загруженные в админке сборки клиента переживают пересоздание контейнера.
      - ./data/releases:/app/data/releases
      # Снимки экрана, приложенные к обращениям в поддержку.
      - ./data/attachments:/app/data/attachments
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-remit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-remit}
      - REMIT_HBBS_INTERNAL=rustdesk:21116
      - JWT_KEY=${JWT_KEY:?задайте JWT_KEY}
      - REMIT_CLIENT_TOKEN_TTL=${REMIT_CLIENT_TOKEN_TTL:-2592000}
      - REMIT_VK_CLIENT_ID=${REMIT_VK_CLIENT_ID:-}
      - REMIT_DOMAIN=${PUBLIC_DOMAIN}
      - REMIT_ID_SERVER=${PUBLIC_ADDR}:21116
      - REMIT_RELAY_SERVER=${PUBLIC_ADDR}:21117
      - REMIT_API_SERVER=https://${PUBLIC_DOMAIN}
      - REMIT_PUBLIC_KEY=${RUSTDESK_PUBLIC_KEY:-}
      - REMIT_AUTH_SECRET=${REMIT_AUTH_SECRET:?задайте REMIT_AUTH_SECRET}
      - REMIT_SERVICE_TOKEN=${REMIT_SERVICE_TOKEN}
      - REMIT_ADMIN_EMAILS=${REMIT_ADMIN_EMAILS:-}
      - REMIT_RELEASES_DIR=/app/data/releases
      - REMIT_MAX_UPLOAD_BYTES=${REMIT_MAX_UPLOAD_BYTES:-1073741824}
      - REMIT_ATTACHMENTS_DIR=/app/data/attachments
      - REMIT_MAX_ATTACHMENT_BYTES=${REMIT_MAX_ATTACHMENT_BYTES:-10485760}
      - REMIT_MAX_ATTACHMENTS=${REMIT_MAX_ATTACHMENTS:-5}
      - REMIT_FREE_SECONDS_PER_DAY=${REMIT_FREE_SECONDS_PER_DAY:-10800}
      - REMIT_SUPPORT_URL=${REMIT_SUPPORT_URL:-https://${PUBLIC_DOMAIN}/kabinet/podderzhka}
      - REMIT_SUPPORT_EMAIL=${REMIT_SUPPORT_EMAIL:-support@remit.su}
      - REMIT_SALES_EMAIL=${REMIT_SALES_EMAIL:-sales@remit.su}
      - REMIT_SMTP_HOST=${REMIT_SMTP_HOST:-}
      - REMIT_SMTP_PORT=${REMIT_SMTP_PORT:-465}
      - REMIT_SMTP_SECURE=${REMIT_SMTP_SECURE:-true}
      - REMIT_SMTP_USER=${REMIT_SMTP_USER:-}
      - REMIT_SMTP_PASSWORD=${REMIT_SMTP_PASSWORD:-}
      - REMIT_MAIL_FROM=${REMIT_MAIL_FROM:-RemIT <noreply@remit.su>}
      - REMIT_LEGAL_NAME=${REMIT_LEGAL_NAME:-}
      - REMIT_LEGAL_INN=${REMIT_LEGAL_INN:-}
      - REMIT_LEGAL_OGRN=${REMIT_LEGAL_OGRN:-}
      - REMIT_LEGAL_ADDRESS=${REMIT_LEGAL_ADDRESS:-}
      - REMIT_LEGAL_BANK=${REMIT_LEGAL_BANK:-}
      - REMIT_LEGAL_PHONE=${REMIT_LEGAL_PHONE:-}
      - REMIT_LEGAL_REVIEWED=${REMIT_LEGAL_REVIEWED:-}
      - REMIT_CLIENT_SOURCE_URL=${REMIT_CLIENT_SOURCE_URL:-https://github.com/Anathom1a/rustdesk/tree/remit}
      - REMIT_YANDEX_VERIFICATION=${REMIT_YANDEX_VERIFICATION:-}
      - REMIT_GOOGLE_VERIFICATION=${REMIT_GOOGLE_VERIFICATION:-}
      - REMIT_YANDEX_METRIKA_ID=${REMIT_YANDEX_METRIKA_ID:-}
      - REMIT_TRIAL_MAX_DAYS=${REMIT_TRIAL_MAX_DAYS:-30}
      - REMIT_TRIAL_DEFAULT_DAYS=${REMIT_TRIAL_DEFAULT_DAYS:-14}
      - REMIT_TRIAL_PLAN=${REMIT_TRIAL_PLAN:-pro}
      - REMIT_TELEGRAM_BOT_TOKEN=${REMIT_TELEGRAM_BOT_TOKEN:-}
      - REMIT_TELEGRAM_CHAT_ID=${REMIT_TELEGRAM_CHAT_ID:-}
      - REMIT_BILLING_PROVIDER=${REMIT_BILLING_PROVIDER:-yookassa}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:-}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:-}
      - YOOKASSA_RETURN_URL=https://${PUBLIC_DOMAIN}/kabinet/podpiska
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: remit-nginx
    depends_on:
      - web
      - rustdesk
    ports:
      - '80:80'
      - '443:443'
      # wss:// веб-клиента к hbbs и hbbr.
      - '21118:21118'
      - '21119:21119'
    volumes:
      - ./nginx/remit.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/remit-proxy.inc:/etc/nginx/conf.d/remit-proxy.inc:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    restart: unless-stopped
