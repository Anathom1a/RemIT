# nginx для RemIT.
#
# Всё за доменом — витрину, кабинет, админку и API клиента RustDesk (вход,
# адресная книга, heartbeat, аудит) — обслуживает сайт. Отдельной панели
# rustdesk-api нет. Отдельные location ниже нужны только там, где у запроса
# особые лимиты: большие загрузки и долгая раздача файлов.

upstream remit_web {
    server web:3000;
}

server {
    listen 80;
    server_name remit.su www.remit.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name remit.su www.remit.su;

    ssl_certificate     /etc/letsencrypt/live/remit.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 32m;

    # --- Загрузка сборок клиента из админки ---
    location = /api/v1/admin/releases/upload {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        # Файлы установщиков весят десятки и сотни мегабайт.
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Раздача сборок ---
    location /api/download/ {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /obnovlenie/download/ {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # --- Обращения в поддержку со снимками экрана ---
    # Пять файлов по 10 МБ не помещаются в общий лимит 32m: без отдельного
    # правила nginx отвечал бы 413 ещё до приложения.
    location = /api/v1/support/tickets {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        client_max_body_size 64m;
    }

    # --- Сайт, кабинет, админка и API клиента ---
    location / {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }
}

# --- Веб-клиент (бета): WebSocket к hbbs и hbbr ---
# Страница открыта по https, поэтому браузер соединяется только по wss://.
# hbbs и hbbr слушают WebSocket без TLS (21118, 21119) — шифрование здесь.
upstream rustdesk_ws_id {
    server rustdesk:21118;
}

upstream rustdesk_ws_relay {
    server rustdesk:21119;
}

server {
    listen 21118 ssl;
    http2 off;
    server_name remit.su;
    ssl_certificate     /etc/letsencrypt/live/remit.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://rustdesk_ws_id;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 21119 ssl;
    http2 off;
    server_name remit.su;
    ssl_certificate     /etc/letsencrypt/live/remit.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://rustdesk_ws_relay;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
