# nginx для RemIT.
#
# Ключевая деталь: /api/heartbeat и /api/audit/conn идут не в панель
# rustdesk-api, а в наш шлюз. Он считает время сессий, добавляет в ответ
# heartbeat список disconnect при исчерпании бесплатных 3 часов и только
# потом отдаёт запрос панели. Остальные /api/* обслуживает панель — она
# отвечает за вход, адресную книгу и доступные устройства в клиенте.
#
# Наши пути внутри /api/ перечислены точечно, иначе их перехватит панель:
# /api/v1/* (кабинет, квоты, админка), /api/download/ (сборки) и
# /api/version/latest (проверка обновлений).

upstream remit_web {
    server web:3000;
}

upstream rustdesk_api {
    server rustdesk:21114;
}

server {
    listen 80;
    server_name remit.su www.remit.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name remit.su www.remit.su;

    ssl_certificate     /etc/letsencrypt/live/remit.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remit.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 32m;

    # --- Загрузка сборок клиента из админки ---
    location = /api/v1/admin/releases/upload {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        # Файлы установщиков весят десятки и сотни мегабайт.
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Раздача сборок ---
    location /api/download/ {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /obnovlenie/download/ {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # --- Учёт квот: шлюз перед панелью ---
    location = /api/heartbeat {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    location = /api/audit/conn {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    # --- Проверка обновлений клиента ---
    # Адрес зашит в клиент при сборке. Путь начинается с /api/, но у панели
    # есть свой /api/version, поэтому без этого точного совпадения запрос
    # уходил бы в панель и проверка обновлений молча возвращала бы 404.
    location = /api/version/latest {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    # --- Наше API: кабинет, подписки, квоты ---
    location /api/v1/ {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    # --- Панель, веб-клиент и остальное API RustDesk ---
    location /api/ {
        proxy_pass http://rustdesk_api;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    location /_admin/ {
        proxy_pass http://rustdesk_api;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    location /webclient/ {
        proxy_pass http://rustdesk_api;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }

    # --- Сайт и личный кабинет ---
    location / {
        proxy_pass http://remit_web;
        include /etc/nginx/conf.d/remit-proxy.inc;
    }
}
