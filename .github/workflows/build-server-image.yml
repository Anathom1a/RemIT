name: Сборка образа сервера RemIT

# Собирает hbbs и hbbr со встроенной проверкой суточного лимита и токенов
# входа и публикует приватный образ в GitHub Container Registry. Панели
# rustdesk-api в образе нет: вход и адресные книги обслуживает сайт.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-server-image.yml
      - client/patches/hbbs-quota-hook.py
      - client/patches/server-cmd-hook.py

permissions:
  contents: read
  packages: write

env:
  # Имя образа задаётся в первом шаге: GHCR принимает только строчные буквы,
  # а владелец репозитория пишется с заглавной.
  IMAGE_REPO: rustdesk-server-s6-remit

jobs:
  build-amd64:
    name: linux/amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Имя образа
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=ghcr.io/${owner}/${IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Получить этот репозиторий
        uses: actions/checkout@v4
        with:
          path: remit

      - name: Получить rustdesk-server (ветка forapi)
        uses: actions/checkout@v4
        with:
          repository: lejianwen/rustdesk-server
          ref: forapi
          submodules: recursive
          path: rustdesk-server

      - name: Встроить проверку суточного лимита в hbbs
        run: |
          python3 remit/client/patches/hbbs-quota-hook.py \
            rustdesk-server/src/rendezvous_server.rs
          # Команды hbbs/hbbr из админки сайта по сервисному токену.
          python3 remit/client/patches/server-cmd-hook.py rustdesk-server/src

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Кэш сборки Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustdesk-server

      - name: Собрать hbbs, hbbr и rustdesk-utils
        run: |
          # musl-gcc нужен для C-зависимостей при сборке под musl.
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --manifest-path rustdesk-server/Cargo.toml \
            --release --all-features --target=x86_64-unknown-linux-musl

      - name: Разложить бинарники
        run: |
          install -m 0755 rustdesk-server/target/x86_64-unknown-linux-musl/release/hbbs \
            rustdesk-server/docker/rootfs/usr/bin/hbbs
          install -m 0755 rustdesk-server/target/x86_64-unknown-linux-musl/release/hbbr \
            rustdesk-server/docker/rootfs/usr/bin/hbbr
          install -m 0755 rustdesk-server/target/x86_64-unknown-linux-musl/release/rustdesk-utils \
            rustdesk-server/docker/rootfs/usr/bin/rustdesk-utils

      - name: Образ без панели
        run: |
          DOCKERFILE=rustdesk-server/docker/Dockerfile
          { printf 'FROM alpine:3.20\nRUN apk add --no-cache tzdata tar xz\n'; tail -n +2 "$DOCKERFILE"; } > "$DOCKERFILE.remit"
          mv "$DOCKERFILE.remit" "$DOCKERFILE"
          rm -rf rustdesk-server/docker/rootfs/etc/s6-overlay/s6-rc.d/api \
                 rustdesk-server/docker/rootfs/etc/s6-overlay/s6-rc.d/user/contents.d/api

      - name: Собрать итоговый образ
        run: |
          docker build --build-arg S6_ARCH=x86_64 \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            rustdesk-server/docker

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать образ
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Итог
        run: |
          {
            echo "## Образ сервера RemIT"
            echo "\`${IMAGE_NAME}:latest\`"
            echo "Включает проверку суточного лимита перед выдачей соединения."
            echo "Держите пакет приватным: серверу достаточно права read:packages."
          } >> "$GITHUB_STEP_SUMMARY"
