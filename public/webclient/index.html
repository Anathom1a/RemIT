<!DOCTYPE html>
<html>

<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="/webclient/">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="RemIT — веб-клиент удалённого доступа (бета).">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="RemIT">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

    <title>RemIT — веб-клиент (бета)</title>
    <link rel="manifest" href="manifest.json">
    <script src="/webclient-config/index.js"></script>
    <script>
        // RemIT: аналитика Firebase (Google) отключена. Заглушка нужна, чтобы
        // клиент не подгружал настоящий Firebase с www.gstatic.com.
        (function () {
            var noop = function () {};
            var analytics = { logEvent: noop, setUserId: noop, setUserProperties: noop, setCurrentScreen: noop, setAnalyticsCollectionEnabled: noop };
            var apps = [];
            window.firebase = {
                SDK_VERSION: '8.10.1',
                apps: apps,
                initializeApp: function (options, name) {
                    var app = { name: name || '[DEFAULT]', options: options || {}, automaticDataCollectionEnabled: false,
                        delete: function () { return Promise.resolve(); }, analytics: function () { return analytics; } };
                    apps.push(app);
                    return app;
                },
                app: function (name) { return apps.filter(function (a) { return a.name === (name || '[DEFAULT]'); })[0] || apps[0]; },
                analytics: function () { return analytics; }
            };
            // HTML-отрисовка: CanvasKit грузился бы с unpkg.com.
            window.flutterWebRenderer = 'html';
        })();
    </script>
    <script src="ogvjs-1.8.6/ogv.js"></script>
    <script type="module" crossorigin src="js/dist/index.js"></script>
    <script>
    </script>
    <link rel="modulepreload" href="js/dist/vendor.js">
    <script src="yuv-canvas-1.2.6.js"></script>

    <style>
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border: 15px solid;
            border-top: 16px solid #024eff;
            border-right: 16px solid white;
            border-bottom: 16px solid #024eff;
            border-left: 16px solid white;
            width: 120px;
            height: 120px;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% {
                -webkit-transform: rotate(0deg);
            }

            100% {
                -webkit-transform: rotate(360deg);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

</head>

<body>
<div class="loading">
    <div class="loader"></div>
</div>
<div id="remit-beta" style="position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:calc(100vw - 24px);
    display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(15,23,42,.92);color:#e2e8f0;
    font:13px/1.35 -apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35)">
    <span><b style="color:#fbbf24">Бета</b> · Веб-клиент RemIT в бета-тесте. Для постоянной работы
        <a href="/skachat" target="_blank" rel="noopener" style="color:#60a5fa">установите приложение</a>.</span>
    <button type="button" aria-label="Скрыть" onclick="this.parentNode.remove()"
        style="border:0;background:transparent;color:#94a3b8;font-size:18px;cursor:pointer;line-height:1">×</button>
</div>
<script>
    // RemIT: без service worker — после обновления клиента браузер сразу берёт
    // новую версию, а не закэшированную старую.
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (list) {
            list.forEach(function (registration) { registration.unregister(); });
        });
    }
    var scriptTag = document.createElement('script');
    scriptTag.src = 'main.dart.js';
    scriptTag.type = 'application/javascript';
    document.body.append(scriptTag);
</script>
</body>

</html>
